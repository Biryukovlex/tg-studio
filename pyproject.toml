[project]
name = "tg-studio"
version = "0.1.0"
description = "Telegram channel analytics with a source-aware writing Studio"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
