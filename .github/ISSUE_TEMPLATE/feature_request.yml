name: Feature request
description: Propose a focused improvement to TG Studio
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior, not only a specific implementation.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, security, and data impact
      description: Note any new provider, stored data, permissions, or external traffic.
